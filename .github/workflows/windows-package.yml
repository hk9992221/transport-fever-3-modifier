name: Windows x64 手动打包

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 编译并打包 Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装固定版本 Zig
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.14.1'
          $expectedHash = '554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-windows.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'tf3-zig'
          $url = "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Zig 下载文件的 SHA-256 不匹配。'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $zig = Join-Path $destination "zig-x86_64-windows-$version/zig.exe"
          & $zig version
          if ($LASTEXITCODE -ne 0) { throw 'Zig 无法运行。' }
          Split-Path $zig -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 编译、检查并生成便携包
        run: ./scripts/build-windows.ps1

      - name: 上传便携包与校验文件
        uses: actions/upload-artifact@v7
        with:
          name: TransportFever3Modifier-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
